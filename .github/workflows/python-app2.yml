name: Daily Stock Data Fetch + Scanner

on:
  workflow_dispatch:

  schedule:
    # Monday-Friday at 4:00 PM IST (10:30 UTC)
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-and-scan:
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout Repository
      ####################################################
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ####################################################
      # Setup Python
      ####################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      ####################################################
      # Upgrade pip
      ####################################################
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      ####################################################
      # Install FetchData Dependencies
      ####################################################
      - name: Install FetchData Dependencies
        run: |
          pip install pandas
          pip install numpy
          pip install requests
          pip install websocket-client
          pip install openpyxl
          pip install pyarrow
          pip install fastparquet
          pip install XlsxWriter
          pip install git+https://github.com/rongardF/tvdatafeed.git

      ####################################################
      # Verify tvDatafeed
      ####################################################
      - name: Verify tvDatafeed
        run: |
          python -c "from tvDatafeed import TvDatafeed, Interval; print('tvDatafeed Installed Successfully')"

      ####################################################
      # Run Fetchdata.py
      ####################################################
      - name: Run Fetchdata.py
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python Fetchdata.py

      ####################################################
      # Display Downloaded Files
      ####################################################
      - name: Display Downloaded Files
        run: |
          echo "========== Daily =========="
          ls -lh stock_data_D || true

          echo "========== Weekly =========="
          ls -lh stock_data_W || true

          echo "========== Monthly =========="
          ls -lh stock_data_M || true

      ####################################################
      # Install TA-Lib
      ####################################################
      - name: Install TA-Lib
        run: |
          sudo apt-get update
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      ####################################################
      # Install Scanner Dependencies
      ####################################################
      - name: Install Scanner Packages
        run: |
          pip install TA-Lib

      ####################################################
      # Run Scanner
      ####################################################
      - name: Run scanner.py
        run: |
          python scanner.py

      ####################################################
      # Show Output Folder
      ####################################################
      - name: Show Scanner Output
        run: |
          ls -lh Output || true

      ####################################################
      # Commit & Push Everything
      ####################################################
      - name: Commit and Push All Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes
          git add .

          # Exit if nothing changed
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          # Commit changes
          git commit -m "Daily Stock Data & Scanner Update - $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Get latest changes
          git fetch origin main
          git pull --rebase origin main

          # Push changes
          git push origin HEAD:main

      ####################################################
      # Completed
      ####################################################
      - name: Workflow Completed
        run: |
          echo "========================================"
          echo "Daily Workflow Completed Successfully"
          echo "Fetchdata.py Completed"
          echo "Scanner.py Completed"
          echo "All Files Committed to GitHub"
          echo "========================================"
