name: Fetch Stock Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

jobs:

  fetch-stock-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Packages
        run: |
          pip install pandas
          pip install pyarrow
          pip install fastparquet
          pip install websocket-client
          pip install requests
          pip install openpyxl
          pip install XlsxWriter
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Verify tvDatafeed
        run: |
          python -c "from tvDatafeed import TvDatafeed, Interval; print('tvDatafeed OK')"

      - name: Run Script
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python Fetchdata.py

      - name: Show Files
        run: |
          echo "Current Folder:"
          pwd

          echo ""
          echo "Directory Tree:"
          ls -R

      - name: Commit Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_data_D || true
          git add stock_data_W || true
          git add stock_data_M || true
          git add download_log.txt || true
          git add error_symbols.txt || true

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Auto Update Stock Data"
            git push
          fi
