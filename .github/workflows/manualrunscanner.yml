name: Manual NSE Scanner Run

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TA-Lib C-Library Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas openpyxl TA-Lib

      - name: Create Output Directory
        run: mkdir -p Output

      - name: Execute Scanner Script
        run: python scanner.py

      - name: Upload Output Excel Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-reports-${{ github.run_id }}
          path: Output/
          retention-days: 7
